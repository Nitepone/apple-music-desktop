name: Build Application

on: [push]

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
    - uses: actions/checkout@v2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build via Docker
      run: |
        export DOCKERIMAGE_NAME="ghcr.io/nitepone/apple-music-builder:latest"
        docker pull ${DOCKERIMAGE_NAME} || true
        ./build-with-docker.sh --dist
        docker push ${DOCKERIMAGE_NAME}


    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: apple-music-electron-appimage
        path: ./dist/apple-music*.AppImage
        if-no-files-found: error

    - name: Upload Debian package
      uses: actions/upload-artifact@v4
      with:
        name: apple-music-electron-deb
        path: ./dist/apple-music*.deb
        if-no-files-found: error
